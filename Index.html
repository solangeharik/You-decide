<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YOU DECIDE — Furniture & Interiors</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

*{box-sizing:border-box;margin:0;padding:0}

:root{
--black:#171614;
--cream:#f3eee7;
--beige:#d8cbbd;
--white:#fff;
--gray:#77716a;
--line:#e5dfd7;
}

body{
font-family:'DM Sans',Arial,sans-serif;
color:var(--black);
background:#faf9f7;
}

a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}

header{
height:82px;
background:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 5%;
position:sticky;
top:0;
z-index:100;
border-bottom:1px solid var(--line);
}

.logo{
font-size:23px;
font-weight:600;
letter-spacing:6px;
}

nav{
display:flex;
gap:35px;
font-size:13px;
}

nav a:hover{opacity:.5}

.header-right{
display:flex;
align-items:center;
gap:20px;
}

.cart{
border:0;
background:var(--black);
color:white;
padding:12px 20px;
border-radius:2px;
font-size:12px;
}

.hero{

min-height:620px;
position:relative;
display:flex;
align-items:center;
overflow:hidden;
background:

url("https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=2200&q=90");
background-size:cover;
background-position:center;
color:#fff;
}

.hero-content{
width:90%;
max-width:1250px;
margin:auto;
}

.small{
font-size:11px;
letter-spacing:4px;
text-transform:uppercase;
margin-bottom:25px;
}

.hero h1{
font-family:'Playfair Display',serif;
font-size:clamp(55px,8vw,105px);
font-weight:400;
line-height:.98;
max-width:850px;
}

.hero p{
font-size:17px;
max-width:530px;
line-height:1.7;
margin:28px 0;
color:#eee;
}

.btn{
display:inline-block;
background:#fff;
color:#171614;
padding:16px 29px;
font-size:12px;
letter-spacing:1px;
text-transform:uppercase;
border:0;
}

.btn.dark{
background:var(--black);
color:white;
}

.intro{
padding:110px 7%;
text-align:center;
background:#fff;
}

.intro .small{color:#8b8279}

.intro h2{
font-family:'Playfair Display',serif;
font-weight:400;
font-size:clamp(38px,5vw,65px);
max-width:900px;
margin:0 auto 25px;
}

.intro p{
max-width:650px;
margin:auto;
color:var(--gray);
line-height:1.8;
}

.section{
padding:100px 6%;
}

.section-head{
display:flex;
justify-content:space-between;
align-items:end;
margin-bottom:40px;
}

.section-head h2{
font-family:'Playfair Display',serif;
font-size:48px;
font-weight:400;
}

.section-head p{
color:var(--gray);
font-size:13px;
max-width:300px;
}

.categories{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
}

.category{
height:470px;
position:relative;
overflow:hidden;
background:#ddd;
}

.category img{
width:100%;
height:100%;
object-fit:cover;
transition:transform .7s;
}

.category:hover img{transform:scale(1.05)}

.category:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(transparent 45%,rgba(0,0,0,.65));
}
